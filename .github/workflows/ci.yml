name: CI
on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Tests automatisés
        run: npm test
      - name: Test du service worker (aucune donnée en cache)
        run: npm run test:sw
      - name: Compilation
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-ci
      - name: Vérification des types (informative)
        run: npm run typecheck
        continue-on-error: true
